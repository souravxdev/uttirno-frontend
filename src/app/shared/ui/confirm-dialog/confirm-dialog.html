<dialog
  #dlg
  [attr.aria-labelledby]="titleId"
  class="m-auto w-[calc(100vw-2rem)] max-w-sm rounded-xl p-0 shadow-lg"
>
  <div class="p-5">
    <h2 [id]="titleId" class="text-base font-semibold text-slate-900">
      {{ title() }}
    </h2>
    @if (message()) {
      <p class="mt-2 text-sm text-slate-600">{{ message() }}</p>
    }
    <div class="mt-5 flex gap-3">
      <button
        app-btn
        type="button"
        variant="secondary"
        class="flex-1"
        (click)="close()"
      >
        {{ i18n.t().common.cancel }}
      </button>
      <button
        app-btn
        type="button"
        [variant]="danger() ? 'danger' : 'primary'"
        class="flex-1"
        (click)="confirm()"
      >
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</dialog>
