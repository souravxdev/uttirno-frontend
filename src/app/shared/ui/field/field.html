<label class="label" [attr.for]="forId() || null">
  {{ label() }}
  @if (required()) {
    <span class="text-red-500" aria-hidden="true">*</span>
  }
</label>
<ng-content />
@if (error(); as err) {
  <p class="mt-1 text-xs text-red-600">{{ err }}</p>
} @else if (hint()) {
  <p class="mt-1 text-xs text-slate-500">{{ hint() }}</p>
}
