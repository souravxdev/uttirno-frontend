<nav
  class="sticky top-14 z-30 -mx-4 border-b border-slate-200 bg-white px-4 md:-mx-6 md:px-6"
>
  <div class="flex md:inline-flex md:gap-1">
    @for (tab of tabs; track tab.path) {
      <a
        [routerLink]="tab.path"
        routerLinkActive="border-primary-600 text-primary-700"
        class="flex min-h-11 flex-1 items-center justify-center gap-1.5 border-b-2 border-transparent px-3 text-sm font-medium text-slate-500 hover:text-slate-800 md:flex-none"
      >
        {{ label(tab.key) }}
      </a>
    }
  </div>
</nav>

<div class="py-5 md:py-6">
  <router-outlet />
</div>
