<div class="card p-4 md:p-5">
  @if (store.phase() === 'done') {
    <p class="text-center text-sm font-medium text-emerald-700">
      {{ i18n.t().feedback.thanks }}
    </p>
  } @else {
    <h2 class="text-base font-semibold">{{ i18n.t().feedback.title }}</h2>
    <p class="mt-1 text-sm text-slate-500">{{ i18n.t().feedback.prompt }}</p>

    <div
      class="mt-3 flex gap-1"
      role="radiogroup"
      [attr.aria-label]="i18n.t().feedback.title"
    >
      @for (n of STARS; track n) {
        <button
          type="button"
          class="flex size-11 cursor-pointer items-center justify-center rounded-lg hover:bg-amber-50"
          role="radio"
          [attr.aria-checked]="rating() === n"
          [attr.aria-label]="n + ' / 5'"
          (click)="setRating(n)"
        >
          <svg
            class="size-7"
            viewBox="0 0 24 24"
            [attr.fill]="n <= rating() ? '#f59e0b' : 'none'"
            [attr.stroke]="n <= rating() ? '#f59e0b' : '#cbd5e1'"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path
              d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.2l1-5.8L3.5 9.2l5.9-.9z"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      }
    </div>

    <textarea
      rows="2"
      class="input mt-3 h-auto py-2"
      [attr.placeholder]="i18n.t().feedback.commentPlaceholder"
      [value]="comment()"
      (input)="updateComment($event)"
    ></textarea>

    @if (store.phase() === 'error') {
      <p class="mt-2 text-sm text-rose-600">{{ i18n.t().feedback.error }}</p>
    }

    <button
      app-btn
      type="button"
      class="mt-3 w-full sm:w-auto"
      [disabled]="rating() < 1"
      [loading]="store.phase() === 'submitting'"
      (click)="submit()"
    >
      {{ i18n.t().feedback.submit }}
    </button>
  }
</div>
