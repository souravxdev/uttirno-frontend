<div class="flex min-h-screen flex-col">
  <header
    class="sticky top-0 z-40 border-b border-slate-200 bg-white/95 backdrop-blur"
  >
    <div
      class="mx-auto flex h-14 w-full max-w-6xl items-center justify-between gap-2 px-4 md:px-6"
    >
      <a routerLink="/" class="flex items-baseline gap-2">
        <span class="text-lg font-bold text-primary-700">উত্তীর্ণ</span>
        <span class="hidden text-sm font-medium text-slate-400 sm:inline">
          Uttirno
        </span>
      </a>

      <nav class="flex items-center gap-1 sm:gap-2">
        <div class="hidden items-center gap-1 md:flex">
          <a app-btn variant="ghost" size="sm" routerLink="/browse">
            {{ i18n.t().nav.browse }}
          </a>
          <a app-btn variant="ghost" size="sm" routerLink="/exam">
            {{ i18n.t().nav.exam }}
          </a>
          <a app-btn variant="ghost" size="sm" routerLink="/history">
            {{ i18n.t().nav.history }}
          </a>
        </div>
        @if (auth.isAdmin()) {
          <a app-btn variant="ghost" size="sm" routerLink="/admin">
            {{ i18n.t().nav.admin }}
          </a>
        }
        <button
          app-btn
          type="button"
          variant="ghost"
          size="sm"
          (click)="i18n.toggle()"
        >
          {{ i18n.t().languageToggle }}
        </button>
        @if (auth.isLoggedIn()) {
          <span class="hidden max-w-40 truncate text-sm text-slate-500 lg:inline">
            {{ auth.user()?.email }}
          </span>
          <button
            app-btn
            type="button"
            variant="ghost"
            size="sm"
            (click)="signOut()"
          >
            {{ i18n.t().nav.signOut }}
          </button>
        } @else {
          <a app-btn size="sm" routerLink="/auth/login">
            {{ i18n.t().nav.signIn }}
          </a>
        }
      </nav>
    </div>
  </header>

  <main [class]="mainClass()">
    <router-outlet />
  </main>

  @if (showBottomNav()) {
    <app-bottom-nav />
  }
  <app-toast-container />
</div>
