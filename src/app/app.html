<div class="min-h-screen bg-slate-50 text-slate-900">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
      <div>
        <h1 class="text-xl font-bold">{{ i18n.t().appTitle }}</h1>
        <p class="text-sm text-slate-500">{{ i18n.t().tagline }}</p>
      </div>
      <button
        type="button"
        class="rounded-md border border-slate-300 px-3 py-1.5 text-sm font-medium hover:bg-slate-100"
        (click)="i18n.toggle()"
      >
        {{ i18n.t().languageToggle }}
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-8">
    <section class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
      <h2 class="text-sm font-semibold tracking-wide text-slate-500 uppercase">
        {{ i18n.t().apiStatus }}
      </h2>
      @switch (healthKind()) {
        @case ('checking') {
          <p class="mt-2 text-slate-500">{{ i18n.t().checking }}</p>
        }
        @case ('up') {
          <p class="mt-2 font-medium text-emerald-700">
            {{ i18n.t().apiUp }}
            <span class="font-normal text-slate-500">
              — {{ i18n.t().apiVersion }} {{ healthVersion() }}
            </span>
          </p>
        }
        @case ('down') {
          <p class="mt-2 font-medium text-red-700">{{ i18n.t().apiDown }}</p>
        }
      }
    </section>
    <router-outlet />
  </main>
</div>
